<h1 data-hf-id="hf-jb9z" id="chapter-title" class="clip" data-start="12" data-duration="13" data-track-index="2">1- Define</h1>

<script>
const tl=gsap.timeline({paused:true});
tl.fromTo('#phone',{opacity:0,y:20},{opacity:1,y:0,duration:.75,ease:'power2.inOut'},0);
tl.fromTo('#call-label',{opacity:0,y:12},{opacity:1,y:0,duration:.6,ease:'power2.inOut'},.15);
tl.fromTo('#ring',{scale:.8,opacity:.85,transformOrigin:'50% 50%'},{scale:1.45,opacity:0,duration:.65,repeat:1},.25);
tl.fromTo('#waves',{opacity:0},{opacity:1,duration:.2,repeat:5,yoyo:true},.25);
tl.to('#phone',{rotation:2,duration:.09,repeat:5,yoyo:true,ease:'sine.inOut'},.35);
tl.to('#phone',{rotation:0,duration:.15},.89);
tl.to('#waves',{opacity:0,duration:.15},1.46);
tl.to('#phone',{x:-600,scale:.75,duration:.65,ease:'power3.inOut'},.95);
tl.to('#call-label',{x:-600,duration:.65,ease:'power3.inOut'},.95);
tl.fromTo('#link',{scaleX:0,opacity:0,transformOrigin:'left center'},{scaleX:1,opacity:1,duration:.35},1.35);
tl.fromTo('#spark',{opacity:0},{opacity:1,duration:.1},1.4);
tl.to('#spark',{x:165,duration:.35,ease:'power2.inOut'},1.4);
tl.to('#spark',{opacity:0,duration:.1},1.75);
tl.fromTo('#screen',{opacity:0,y:20},{opacity:1,y:0,duration:.4,ease:'power3.out'},1.6);
tl.fromTo('#entry-label',{opacity:0,y:12},{opacity:1,y:0,duration:.35},1.7);
tl.fromTo('#link-two',{scaleX:0,opacity:0,transformOrigin:'left center'},{scaleX:1,opacity:1,duration:.35},2.9);
tl.fromTo('#document',{opacity:0,scale:.85,y:20},{opacity:1,scale:1,y:0,duration:.45,ease:'power3.out'},3.05);
tl.fromTo('#event-label',{opacity:0,y:14},{opacity:1,y:0,duration:.35},3.15);
tl.fromTo('#plus',{opacity:0,scale:.5,transformOrigin:'267px 347px'},{opacity:1,scale:1,duration:.3,ease:'back.out(1.3)'},3.3);
// Uniform 1.6× slowdown, with a five-second insert before the original typing beat.
for(const tween of tl.getChildren(false,true,false)){
  const start=tween.startTime();
  tween.duration(tween.duration()*1.6);
  tween.startTime(start*1.6+(start>=1.95?5:0));
}
// Hold the fully revealed desktop for one second, then zoom more gently.
tl.to(['#phone','#call-label','#link','#entry-label'],{opacity:0,duration:.7},4.2);
tl.to('#screen',{scale:2.5,opacity:0,duration:.9,ease:'power3.inOut'},4.2);
tl.fromTo('#detail',{scale:.26,x:10,y:-67,opacity:0},{scale:1,x:0,y:0,opacity:1,duration:.95,ease:'power3.inOut'},4.2);
tl.fromTo('#cell-focus',{opacity:0},{opacity:1,duration:.15},5.25);
tl.to('#v-title',{clipPath:'inset(0 0% 0 0)',duration:.65,ease:'steps(14)'},5.4);
tl.to('#cell-focus',{x:500,scaleX:.46,transformOrigin:'left center',duration:.16},6.4);
tl.to('#v-qty',{clipPath:'inset(0 0% 0 0)',duration:.35,ease:'steps(6)'},7.05);
tl.to('#cell-focus',{x:750,scaleX:.59,duration:.16},7.45);
tl.to('#v-cost',{clipPath:'inset(0 0% 0 0)',duration:.35,ease:'steps(7)'},7.65);
tl.to('#v-total',{clipPath:'inset(0 0% 0 0)',duration:.25},8.15);
tl.to('#cell-focus',{opacity:0,duration:.2},8.15);
// Preserve this exact filled row as it shrinks into the monitor icon.
tl.to('#detail',{scale:.26,x:10,y:-67,duration:.9,ease:'power3.inOut'},8.92);
tl.to('#screen',{scale:1,opacity:1,duration:.9,ease:'power3.inOut'},8.92);
tl.to(['#phone','#call-label','#link','#entry-label'],{opacity:1,duration:.5},9.32);
// Give the overview a longer handoff; retain the desktop and entry pacing.
for(const tween of tl.getChildren(false,true,false)) tween.startTime(tween.startTime()+12);
tl.fromTo('#chapter-title',{opacity:0},{opacity:1,duration:1.2,ease:'power2.inOut'},12);
tl.fromTo('#diagram-camera',{scale:1.18,x:0,y:0},{scale:1.18,x:0,y:0,duration:.01},0);
const stages=['define','locate','prepare','confirm','execute','monitor','modify','conclude'];
// Reveal all eight together, then hold for four seconds before isolating Define.
tl.fromTo('.stage-focus',{opacity:0},{opacity:1,duration:.25},1.0);
tl.to(stages.slice(1).map(stage=>'#focus-'+stage),{opacity:0,duration:.4},5.25);
tl.to('#workflow-map',{clipPath:'inset(346px 1101px 106px 16px)',duration:.65,ease:'power2.inOut'},5.65);
tl.to('#diagram-camera',{scale:3.3,x:341,y:-1037,duration:1.5,ease:'power3.inOut'},5.65);
tl.to('#focus-define',{backgroundColor:'rgba(169,204,255,0.13)',duration:.4},7.2);
tl.to('#intro-content',{opacity:0,duration:3.2,ease:'power2.inOut'},9.2);
window.__timelines=window.__timelines||{};window.__timelines.main=tl;
</script>
